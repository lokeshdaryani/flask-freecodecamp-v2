<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comfy Job Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .quote {
            font-size: 1.5em;
            text-align: center;
            margin: 20px;
            color: #f1f1f1;
        }

        .form-container {
            background: #2c3e50;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            color: #ecf0f1;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 15px;
            font-weight: bold;
            color: #ecf0f1;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #bdc3c7;
            font-size: 1em;
            width: 100%;
            background-color: #34495e;
            color: #ecf0f1;
        }

        input[type="file"] {
            margin-top: 10px;
            color: #ecf0f1;
        }

        button {
            background-color: #3498db;
            color: white;
            padding: 10px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
        }

        button:hover {
            background-color: #2980b9;
        }

        img {
            max-width: 200px;
            margin: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        h2 {
            color: #f1f1f1;
            text-align: center;
        }
    </style>
</head>

<body class="bg-dark text-light">
    {%  include 'navbar.html' %}
    <div class="quote">Believe in yourself! Have confidence in your abilities.<br />You are capable of amazing things.</div>

    <img src="/static/cute-girl.jpg" alt="Amazing girl YOU">

    <div class="form-container">
        <h2>Apply for the Role {{job['title']}}</h2>
        <form method="POST" action="/submit" enctype="multipart/form-data">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required />

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required />

            <label for="education_experience">Education & Professional Experience</label>
            <textarea id="education_experience" name="education_experience" rows="4"></textarea>

            <label for="resume">Resume</label>
            <input type="file" id="resume" name="resume" />

            <button type="submit" href="/thankyou">Submit</button>
        </form>
    </div>

    <div class="quote">A journey of a thousand miles begins with a single step.</div>
    {%  include 'footer.html' %}
</body>

</html>
